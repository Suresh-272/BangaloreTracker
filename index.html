<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spendlog">
<meta name="theme-color" content="#0f5c78">
<title>Spendlog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#12202b;--mute:#62727f;--line:#dde4ea;--acc:#0f5c78;--acc-ink:#fff;--owe:#b4570a;--ok:#1d7a4d;--bar:#0f5c78;--bar2:#a9c9d6;
--r:18px;--font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d161d;--card:#16222b;--ink:#e8eff4;--mute:#8da0ae;--line:#26353f;--acc:#4fb3d6;--acc-ink:#07222d;--owe:#f0a35c;--ok:#5cc690;--bar:#4fb3d6;--bar2:#2f5666}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
padding:env(safe-area-inset-top,0) 0 calc(86px + env(safe-area-inset-bottom,0));font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}
.month{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:3px;border:1px solid var(--line)}
.month button{border:0;background:none;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;font-family:inherit}
.month span{min-width:84px;text-align:center;font-weight:500;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;font-weight:700}
.muted{color:var(--mute);font-size:13px}
.ledger .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.ledger .row:first-of-type{padding-top:0}
.ledger .row b{display:block;font-size:15px}
.ledger .amt{font-size:28px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.amt.owe{color:var(--owe)}.amt.ok{color:var(--ok)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-weight:500;font-size:14px;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.del{color:#c0392b;border-color:#c0392b55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.days{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:6px}
.days i{flex:1;background:var(--bar2);border-radius:3px 3px 0 0;min-height:2px}
.days i.on{background:var(--bar)}
.axis{display:flex;justify-content:space-between;margin-top:4px}
.bar{margin:10px 0}.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .tr{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--bar);border-radius:6px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border:0}
.dot{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{text-align:right;font-weight:700;white-space:nowrap}
.item .a small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.day{font-size:13px;color:var(--mute);margin:16px 2px 4px;font-weight:500}
.trend{display:flex;align-items:flex-end;gap:10px;height:120px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.trend .p{display:flex;align-items:flex-end;gap:3px;width:100%;flex:1}
.trend .p i{flex:1;border-radius:3px 3px 0 0;background:var(--bar2);min-height:2px}.trend .p i+i{background:var(--bar)}
.empty{text-align:center;color:var(--mute);padding:24px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0));display:flex;justify-content:space-around;align-items:center;z-index:5}
nav .in{display:flex;max-width:720px;width:100%;justify-content:space-around;align-items:center}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 14px;cursor:pointer}
nav button.on{color:var(--acc);font-weight:700}
nav button span{font-size:20px;line-height:1}
nav .add{background:var(--acc);color:var(--acc-ink);width:54px;height:54px;border-radius:50%;margin-top:-26px;font-size:28px;padding:0;justify-content:center;box-shadow:0 6px 16px #0f5c7855}
.shade{position:fixed;inset:0;background:#0008;z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;z-index:11;max-height:92%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));display:none}
.sheet .in{max-width:560px;margin:0 auto}
.show{display:block}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:9px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px #0002}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
input[type=number],input[type=text],input[type=date]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.big{font-size:30px!important;font-weight:700;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sw{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px;background:var(--bg);border-radius:12px;font-size:15px}
.sw input{width:22px;height:22px;accent-color:var(--acc)}
.hint{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (min-width:700px){.stat .v{font-size:22px}.sheet{left:50%;right:auto;width:560px;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
.item .x{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:8px 10px;margin-right:-6px;cursor:pointer;border-radius:8px;flex:none}
.item .x.arm{color:#fff;background:#c0392b}
body.auth nav,body.auth .month{display:none}
#sync{font-size:12px;margin-top:1px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="wrap">
  <header><div><h1 id="ttl">Spendlog</h1><div class="muted" id="sync"></div></div>
    <div class="month"><button id="pm" aria-label="Previous month">‹</button><span id="ml"></span><button id="nm" aria-label="Next month">›</button></div>
  </header>
  <main id="app"></main>
</div>
<nav><div class="in">
  <button data-v="home"><span>◉</span>Home</button>
  <button data-v="hist"><span>☰</span>History</button>
  <button class="add" id="addb" aria-label="Add entry">+</button>
  <button data-v="ins"><span>▥</span>Insights</button>
</div></nav>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== PASTE YOUR SUPABASE PROJECT URL AND ANON KEY HERE (see README) ===== */
const CFG={URL:"https://cutvselkslnsreydmlme.supabase.co",KEY:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1dHZzZWxrc2xuc3JleWRtbG1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzM5MTYsImV4cCI6MjEwNjYwOTkxNn0.tcGH4f-1gYsvYVeSF8lSxdMCtZJm8kD0ET-d4pn7_JE"};
const CATS=[["Zepto","🛵"],["Instamart","🛒"],["Food","🍜"],["Groceries","🥬"],["Travel","🚕"],["Bills","💡"],["Shopping","🛍️"],["Other","✨"]];
const ICON=Object.fromEntries(CATS);
const KEY="spendlog.v1";
let S={entries:[],people:5};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Couldn't save in this browser")}};
const $=s=>document.querySelector(s);
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const inr=n=>"₹"+(Math.round(n*100)/100).toLocaleString("en-IN",{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let view="home",ym=today().slice(0,7),F=null,armed=null,armedAll=false;

const share=e=>e.amt/(e.split||1);
const others=e=>e.amt-share(e);
function balances(){
  let card=0,xfer=0,owed=0,recv=0;
  S.entries.forEach(e=>{
    if(e.type==="exp"){if(e.card)card+=e.amt;owed+=others(e)}
    else if(e.type==="xfer")xfer+=e.amt;
    else if(e.type==="recv")recv+=e.amt;
  });
  return{toSlice:card-xfer,roomOwe:owed-recv};
}
const inMonth=()=>S.entries.filter(e=>e.date.slice(0,7)===ym).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
function monthStats(list){
  const exp=list.filter(e=>e.type==="exp");
  return{card:exp.filter(e=>e.card).reduce((s,e)=>s+e.amt,0),mine:exp.reduce((s,e)=>s+share(e),0),oth:exp.reduce((s,e)=>s+others(e),0),exp};
}
function catBars(exp){
  const m={};exp.forEach(e=>m[e.cat]=(m[e.cat]||0)+share(e));
  const r=Object.entries(m).sort((a,b)=>b[1]-a[1]),max=r[0]?r[0][1]:1;
  return r.length?r.map(([c,v])=>`<div class="bar"><div class="t"><span>${ICON[c]||"•"} ${esc(c)}</span><b>${inr(v)}</b></div><div class="tr"><i style="width:${v/max*100}%"></i></div></div>`).join(""):`<div class="empty">No spending this month yet.</div>`;
}
function itemRow(e,del){
  let h=itemRowBase(e);
  if(del)h=h.replace(/<\/div>$/,`<button class="x ${armed===e.id?"arm":""}" data-del="${e.id}" aria-label="Delete entry">${armed===e.id?"Delete?":"✕"}</button></div>`);
  return h;
}
function itemRowBase(e){
  if(e.type==="exp"){
    const sp=e.split>1?`Your ${inr(share(e))} of ${inr(e.amt)} · ${e.split} people`:(e.card?"Dad's card":"Other");
    return `<div class="item" data-id="${e.id}"><div class="dot">${ICON[e.cat]||"•"}</div><div class="m"><b>${esc(e.note||e.cat)}</b><span class="muted">${esc(e.cat)}${e.card&&e.split>1?" · Dad's card":""}</span></div><div class="a">${inr(e.amt)}<small>${e.split>1?"yours "+inr(share(e)):(e.card?"card":"")}</small></div></div>`;
  }
  const x=e.type==="xfer";
  return `<div class="item" data-id="${e.id}"><div class="dot">${x?"🏦":"🤝"}</div><div class="m"><b>${x?"Sent to Slice":"Roommates paid you"}</b><span class="muted">${esc(e.note||"")}</span></div><div class="a" style="color:var(--ok)">${x?"−":"+"}${inr(e.amt)}</div></div>`;
}
function grouped(list){
  let out="",last="";
  list.forEach(e=>{
    if(e.date!==last){last=e.date;out+=`<div class="day">${new Date(e.date+"T00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}</div>`}
    out+=itemRow(e,true);
  });
  return out;
}

function render(){
  if(cloud&&booting){$("#app").innerHTML=`<div class="empty">Loading…</div>`;return}
  if(cloud&&!user){document.body.classList.add("auth");$("#app").innerHTML=authHtml();return}
  document.body.classList.remove("auth");
  const d=new Date(ym+"-01T00:00");
  $("#ml").textContent=d.toLocaleDateString("en-IN",{month:"short",year:"numeric"});
  document.querySelectorAll("nav [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  const list=inMonth(),st=monthStats(list),bal=balances();
  let h="";
  if(view==="home"){
    const a=bal.toSlice,b=bal.roomOwe;
    h+=`<section class="card ledger">
      <div class="row"><div><b>${a>=0?"Send to Slice":"Extra sent to Slice"}</b><span class="muted">Card spend not yet moved to Slice</span></div><div class="amt ${a>0.5?"owe":"ok"}">${inr(Math.abs(a))}</div></div>
      <div class="row" style="border:0;padding-bottom:0"><div><b>${b>=0?"Roommates owe you":"You owe roommates"}</b><span class="muted">Their share of what you paid</span></div><div class="amt ${b>0.5?"owe":"ok"}">${inr(Math.abs(b))}</div></div>
      <div class="btns"><button class="btn pri" data-q="xfer">Log Slice transfer</button><button class="btn" data-q="recv">Log roommate payment</button></div>
    </section>
    <div class="stats" style="margin-bottom:14px">
      <div class="stat"><span class="muted">Card spend</span><div class="v">${inr(st.card)}</div></div>
      <div class="stat"><span class="muted">Your share</span><div class="v">${inr(st.mine)}</div></div>
      <div class="stat"><span class="muted">Others' share</span><div class="v">${inr(st.oth)}</div></div>
    </div>
    <section class="card"><h2>Daily spend</h2>${dayBars(st.exp)}</section>
    <section class="card"><h2>Recent</h2>${list.length?list.slice(0,6).map(e=>itemRow(e)).join(""):`<div class="empty">Nothing logged this month.<br>Tap + to add your first expense.</div>`}</section>`;
  }
  if(view==="hist"){
    h+=`<section class="card" style="padding-top:6px">${list.length?grouped(list):`<div class="empty">Nothing logged this month.</div>`}</section>`;
  }
  if(view==="ins"){
    h+=`<section class="card"><h2>Where your share went</h2>${catBars(st.exp)}</section>
    <section class="card"><h2>Last 6 months</h2>${trend()}<div class="muted" style="margin-top:8px">Light bar: card spend · Dark bar: your share</div></section>
    <section class="card"><h2>Settings & backup</h2>
      <label>Default split (people)</label><input type="number" id="ppl" min="1" max="20" value="${S.people}">
      ${cloud?`<p class="muted">Signed in as ${esc(user&&user.email)}. Your data syncs across all devices where you sign in.</p>`:`<p class="muted">Cloud sync is off, so data stays in this browser. Add your Supabase keys at the top of index.html to turn it on.</p>`}
      <div class="btns"><button class="btn" id="exp">Export backup</button><button class="btn" id="imp">Import backup</button></div>
      <div class="btns">${cloud?`<button class="btn" id="out">Sign out</button>`:""}<button class="btn del" id="wipe">${armedAll?"Tap again to delete everything":"Delete all data"}</button></div>
      <input type="file" id="file" accept="application/json" hidden>
    </section>`;
  }
  $("#app").innerHTML=h;
}
function dayBars(exp){
  const d=new Date(ym+"-01T00:00"),n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),v=Array(n).fill(0);
  exp.forEach(e=>{if(e.card)v[+e.date.slice(8)-1]+=e.amt});
  const mx=Math.max(...v,1);
  return `<div class="days">${v.map((x,i)=>`<i class="${x?"on":""}" style="height:${x/mx*100}%" title="${i+1}: ${inr(x)}"></i>`).join("")}</div><div class="axis muted"><span>1</span><span>${Math.ceil(n/2)}</span><span>${n}</span></div>`;
}
function trend(){
  const base=new Date(ym+"-01T00:00"),cols=[];
  for(let i=5;i>=0;i--){
    const d=new Date(base.getFullYear(),base.getMonth()-i,1),k=iso(d).slice(0,7);
    const s=monthStats(S.entries.filter(e=>e.date.slice(0,7)===k));
    cols.push({l:d.toLocaleDateString("en-IN",{month:"short"}),c:s.card,m:s.mine});
  }
  const mx=Math.max(...cols.map(c=>Math.max(c.c,c.m)),1);
  return `<div class="trend">${cols.map(c=>`<div><div class="p"><i style="height:${c.c/mx*100}%"></i><i style="height:${c.m/mx*100}%"></i></div><span class="muted">${c.l}</span></div>`).join("")}</div>`;
}

/* ---------- sheet ---------- */
function openSheet(type,prefill){
  F=Object.assign({id:"",type:type||"exp",amt:"",note:"",cat:"Zepto",date:today(),card:true,split:S.people,touchedSplit:false},prefill||{});
  if(!prefill&&F.type==="exp"&&!["Zepto","Instamart"].includes(F.cat))F.split=1;
  drawSheet();$("#shade").classList.add("show");$("#sheet").classList.add("show");
  setTimeout(()=>{const a=$("#amt");if(a&&!F.id)a.focus()},50);
}
function closeSheet(){$("#shade").classList.remove("show");$("#sheet").classList.remove("show");F=null}
function drawSheet(){
  const x=F.type==="exp",isNew=!F.id;
  const hint=x&&F.split>1&&+F.amt>0?`<div class="hint">Your share <b>${inr(F.amt/F.split)}</b> · others owe you <b>${inr(F.amt-F.amt/F.split)}</b></div>`:"";
  $("#sheetin").innerHTML=`
  ${isNew?`<div class="seg"><button data-t="exp" class="${F.type==="exp"?"on":""}">Expense</button><button data-t="xfer" class="${F.type==="xfer"?"on":""}">Sent to Slice</button><button data-t="recv" class="${F.type==="recv"?"on":""}">Roommate paid</button></div>`:""}
  <label>Amount (₹)</label><input class="big" id="amt" type="number" inputmode="decimal" placeholder="0" value="${F.amt}">
  ${x?`<label>Category</label><div class="chips">${CATS.map(c=>`<button class="chip ${F.cat===c[0]?"on":""}" data-c="${c[0]}">${c[1]} ${c[0]}</button>`).join("")}</div>
  <label>Split between</label><div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip ${F.split==n?"on":""}" data-s="${n}">${n===1?"Just me":n+" people"}</button>`).join("")}</div>
  <div class="sw"><span>Paid with Dad's card</span><input type="checkbox" id="card" ${F.card?"checked":""}></div>${hint}`:""}
  <label>Note ${x?"(optional)":""}</label><input type="text" id="note" placeholder="${x?"e.g. Zepto groceries":"optional"}" value="${esc(F.note)}">
  <label>Date</label><input type="date" id="date" value="${F.date}">
  <div class="btns" style="margin-top:18px">${!isNew?`<button class="btn del" id="del">${F.armDel?"Tap again to delete":"Delete"}</button>`:`<button class="btn" id="cancel">Cancel</button>`}<button class="btn pri" id="save">${isNew?"Save":"Save changes"}</button></div>`;
}
function sync(){
  if(!F)return;
  const g=i=>document.getElementById(i);
  if(g("amt"))F.amt=g("amt").value;if(g("note"))F.note=g("note").value;if(g("date"))F.date=g("date").value||today();if(g("card"))F.card=g("card").checked;
}
function commit(){
  sync();const amt=parseFloat(F.amt);
  if(!(amt>0)){toast("Enter an amount");return}
  const e={id:F.id||uid(),type:F.type,date:F.date,amt,note:F.note.trim()};
  if(F.type==="exp"){e.cat=F.cat;e.card=F.card;e.split=+F.split||1}
  const i=S.entries.findIndex(x=>x.id===e.id);
  if(i>=0)S.entries[i]=e;else S.entries.push(e);
  save();pushUp(e);ym=e.date.slice(0,7);closeSheet();render();toast(i>=0?"Changes saved":"Saved");
}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,.item,#shade");if(!t)return;
  if(t.id==="shade"||t.id==="cancel")return closeSheet();
  if(t.id==="addb")return openSheet("exp");
  if(t.dataset.del){const id=t.dataset.del;if(armed===id){armed=null;removeEntry(id);render();toast("Deleted")}else{armed=id;render();setTimeout(()=>{if(armed===id){armed=null;render()}},3000)}return}
  if(t.dataset.v){view=t.dataset.v;render();scrollTo(0,0);return}
  if(t.id==="pm"||t.id==="nm"){const d=new Date(ym+"-01T00:00");d.setMonth(d.getMonth()+(t.id==="nm"?1:-1));ym=iso(d).slice(0,7);return render()}
  if(t.dataset.q){const b=balances(),a=t.dataset.q==="xfer"?b.toSlice:b.roomOwe;return openSheet(t.dataset.q,{amt:a>0?Math.round(a*100)/100:""})}
  if(t.classList.contains("item")){const e=S.entries.find(x=>x.id===t.dataset.id);if(e)openSheet(e.type,Object.assign({},e,{split:e.split||1}));return}
  if(!F){
    if(t.id==="exp"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="spendlog-"+today()+".json";a.click();return}
    if(t.id==="imp")return $("#file").click();
    if(t.id==="in")return doAuth(false);
    if(t.id==="up")return doAuth(true);
    if(t.id==="out")return signOut();
    if(t.id==="wipe"){if(armedAll){armedAll=false;S.entries=[];save();q({o:"clear"});render();toast("All data deleted")}else{armedAll=true;render();setTimeout(()=>{if(armedAll){armedAll=false;render()}},4000)}return}
    return;
  }
  sync();
  if(t.dataset.t){F.type=t.dataset.t;return drawSheet()}
  if(t.dataset.c){F.cat=t.dataset.c;if(!F.touchedSplit)F.split=["Zepto","Instamart"].includes(F.cat)?S.people:1;return drawSheet()}
  if(t.dataset.s){F.split=+t.dataset.s;F.touchedSplit=true;return drawSheet()}
  if(t.id==="save")return commit();
  if(t.id==="del"){if(F.armDel){const id=F.id;closeSheet();removeEntry(id);render();toast("Deleted")}else{F.armDel=true;t.textContent="Tap again to delete"}}
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="amt"&&F&&F.type==="exp"){sync();const h=document.querySelector(".hint");if(F.split>1&&+F.amt>0){const html=`Your share <b>${inr(F.amt/F.split)}</b> · others owe you <b>${inr(F.amt-F.amt/F.split)}</b>`;if(h)h.innerHTML=html;else{drawSheet();const a=$("#amt");a.focus();a.setSelectionRange(a.value.length,a.value.length)}}else if(h)h.remove()}
  if(ev.target.id==="ppl"){S.people=Math.max(1,Math.min(20,parseInt(ev.target.value)||5));save();pushSettings()}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&F&&ev.target.tagName==="INPUT")commit();if(ev.key==="Escape"&&F)closeSheet();if(ev.key==="Enter"&&cloud&&!user&&ev.target.id==="pw")doAuth(false)});
document.addEventListener("change",ev=>{
  if(ev.target.id!=="file")return;const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.entries))throw 0;
    if(confirm("Replace data on this device with the backup ("+d.entries.length+" entries)?")){S=Object.assign({entries:[],people:5},d);save();pushAll();render();toast("Backup imported")}}catch(e){toast("That file isn't a Spendlog backup")}};r.readAsText(f);
});
/* ---------- cloud sync (Supabase) ---------- */
const cloud=!!(CFG.URL&&CFG.KEY&&window.supabase);
let sb=null,user=null,pend=[],busy=false,pulling=false,again=false,booting=cloud,authMsg="",chan=null,dt;
try{pend=JSON.parse(localStorage.getItem("spendlog.pend")||"[]")}catch(e){}
const savePend=()=>{try{localStorage.setItem("spendlog.pend",JSON.stringify(pend))}catch(e){}};
function setSync(m){const el=$("#sync");if(el)el.textContent=cloud?m:"Saved on this device only"}
function q(op){if(!cloud)return;pend.push(op);savePend();flush()}
const pushUp=e=>q({o:"up",id:e.id,d:e});
const pushSettings=()=>q({o:"up",id:"_settings",d:{people:S.people}});
const removeEntry=id=>{S.entries=S.entries.filter(x=>x.id!==id);save();q({o:"del",id})};
function pushAll(){q({o:"clear"});S.entries.forEach(pushUp);pushSettings()}
const syncErr=e=>setSync(navigator.onLine?"Sync problem: "+((e&&e.message)||"unknown"):"Offline · will sync when back online");
async function flush(){
  if(!sb||!user||busy)return;busy=true;setSync("Syncing…");
  try{
    while(pend.length){
      const p=pend[0];let r;
      if(p.o==="up")r=await sb.from("entries").upsert({user_id:user.id,id:p.id,data:p.d,updated_at:new Date().toISOString()},{onConflict:"user_id,id"});
      else if(p.o==="del")r=await sb.from("entries").delete().eq("id",p.id);
      else r=await sb.from("entries").delete().neq("id","__none__");
      if(r.error)throw r.error;
      pend.shift();savePend();
    }
    setSync("Synced");
  }catch(e){syncErr(e)}
  busy=false;
}
async function pull(){
  if(!sb||!user)return;
  if(pulling){again=true;return}
  pulling=true;
  try{
    await flush();
    if(!pend.length){
      let all=[],from=0;
      for(;;){const r=await sb.from("entries").select("id,data").order("id").range(from,from+999);if(r.error)throw r.error;all=all.concat(r.data);if(r.data.length<1000)break;from+=1000}
      let list=all.filter(r=>r.id!=="_settings").map(r=>r.data);
      const st=all.find(r=>r.id==="_settings");
      pend.forEach(p=>{if(p.o==="clear")list=[];else if(p.o==="del")list=list.filter(x=>x.id!==p.id);else if(p.id!=="_settings"){list=list.filter(x=>x.id!==p.id);list.push(p.d)}});
      S.entries=list;if(st&&st.data&&st.data.people)S.people=st.data.people;
      save();setSync("Synced");
      if(!(document.activeElement&&document.activeElement.id==="ppl"))render();
    }
  }catch(e){syncErr(e)}
  pulling=false;if(again){again=false;pull()}
}
const authHtml=()=>`<section class="card"><h2>Sign in to sync your phone and laptop</h2>
<label>Email</label><input type="text" id="em" inputmode="email" autocapitalize="none" autocomplete="username">
<label>Password</label><input type="password" id="pw" autocomplete="current-password">
<div class="hint" id="am" ${authMsg?"":"hidden"}>${esc(authMsg)}</div>
<div class="btns"><button class="btn" id="up">Create account</button><button class="btn pri" id="in">Sign in</button></div></section>`;
const amsg=t=>{authMsg=t;const h=$("#am");if(h){h.textContent=t;h.hidden=!t}};
async function doAuth(signup){
  const email=$("#em").value.trim(),password=$("#pw").value;
  if(!email||password.length<6)return amsg("Enter your email and a password of at least 6 characters.");
  amsg("Working…");
  const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error)return amsg(r.error.message);
  if(signup&&!r.data.session)amsg("Account created. Confirm the email we sent, then sign in.");else amsg("");
}
async function signOut(){
  await flush();
  if(pend.length&&!confirm("Some changes haven't synced yet and will be lost. Sign out anyway?"))return;
  S={entries:[],people:5};pend=[];savePend();save();authMsg="";
  await sb.auth.signOut();
}
async function setUser(u){
  booting=false;user=u||null;
  if(chan){sb.removeChannel(chan);chan=null}
  if(!user){setSync("Sign in to sync");render();return}
  try{const k="spendlog.seeded."+user.id;if(!localStorage.getItem(k)){S.entries.forEach(pushUp);pushSettings();localStorage.setItem(k,"1")}}catch(e){}
  render();
  chan=sb.channel("entries-sync").on("postgres_changes",{event:"*",schema:"public",table:"entries"},()=>{clearTimeout(dt);dt=setTimeout(pull,400)}).subscribe();
  await pull();
}
async function boot(){
  if(!cloud){render();setSync("");return}
  setSync("Connecting…");render();
  sb=window.supabase.createClient(CFG.URL,CFG.KEY);
  const r=await sb.auth.getSession();
  await setUser(r.data.session&&r.data.session.user);
  sb.auth.onAuthStateChange((ev,s)=>{const u=s&&s.user;if((u&&u.id)!==(user&&user.id))setTimeout(()=>setUser(u),0)});
}
addEventListener("online",()=>pull());
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
boot();
</script>
</body>
</html>
